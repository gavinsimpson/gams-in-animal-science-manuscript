title: Elsevier Journal Format
author: Charles Teague
version: 0.4.5
quarto-required: '>=1.2.198'
source: quarto-journals/elsevier@v0.4.5
source-type: registry
contributes:
  formats:
    common:
      date-format: full
      filters:
        - elsevier.lua
    pdf:
      documentclass: elsarticle
      template-partials:
        - partials/before-body.tex
        - partials/title.tex
      format-resources:
        - elsarticle.cls
      cite-method: natbib
      number-sections: true
    html:
      theme: styles/elsevier.scss
